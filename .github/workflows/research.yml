# Daily SP500 research at 16:00 Romania time (every day, including weekends), plus catch-up runs the same day,
# and on demand from the dashboard's "Run research" button.
# Runs yahoo_unificat.py, commits the new Excel reports and the Top 10 history, then rebuilds and publishes the site.
# GitHub cron is in UTC and can start hours late or be dropped: several schedules per day feed a gate that runs
# only after 16:00 Romania time and only if today's Top 10 history entry does not exist yet.
name: Research SP500
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research
  cancel-in-progress: false
env:
  TZ: Europe/Bucharest
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Run after 16:00 Romania time, once per day
        run: |
          today=$(date +%F); hour=$(date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$((10#$hour))" -lt 16 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Before 16:00 in Romania ($hour h), skipping."
          elif grep -q "\"date\":\"$today\"" Output/top10_history.json; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Today's research ($today) is already recorded, skipping."
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Run the research (all S&P 500 stocks)
        if: steps.gate.outputs.run == 'true'
        run: python yahoo_unificat.py
      - name: Save the new reports in the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/SP500_*.xlsx Output/SP500_*.json Output/complet Output/top10_history.json Investitii
          git commit -m "Daily research $(date +'%d.%m.%Y %H:%M')" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Build the site
        if: steps.gate.outputs.run == 'true'
        run: python build_site.py --refresh
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - name: Wait for the Pages artifact to become listable
        if: steps.gate.outputs.run == 'true'
        run: sleep 30
      - id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5
