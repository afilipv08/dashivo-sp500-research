# One SP500 research per calendar day (Romania time), at any hour, plus on demand from the dashboard's "Run research" button.
# Runs yahoo_unificat.py, commits the new Excel reports and the Top 10 history, then rebuilds and publishes the site.
# GitHub starts scheduled jobs late or drops them under load, so a schedule every two hours (off the full hour) feeds a gate
# that runs only when today's date is not yet in Output/top10_history.json.
name: Research SP500
on:
  schedule:
    - cron: '17 */2 * * *'   # every two hours, off the full hour; the gate keeps one research per day
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research
  cancel-in-progress: false
env:
  TZ: Europe/Bucharest
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Run once per calendar day (Romania time), at whatever hour GitHub starts the job
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          from datetime import date
          today = date.today().isoformat()          # TZ=Europe/Bucharest for the whole job
          days = json.load(open('Output/top10_history.json')).get('days') or []
          done = any(d.get('date') == today for d in days)
          print('run=' + ('false' if done else 'true'))
          print(f'{today}: ' + ('research already recorded, skipping' if done else 'no research yet, running'), file=sys.stderr)
          EOF
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Run the research (all S&P 500 stocks)
        if: steps.gate.outputs.run == 'true'
        run: python yahoo_unificat.py
      - name: Save the new reports in the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/SP500_*.xlsx Output/SP500_*.json Output/complet Output/top10_history.json Investitii
          git commit -m "Daily research $(date +'%d.%m.%Y %H:%M')" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Build the site
        if: steps.gate.outputs.run == 'true'
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python build_site.py --refresh
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - name: Wait for the Pages artifact to become listable
        if: steps.gate.outputs.run == 'true'
        run: sleep 30
      - id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5
