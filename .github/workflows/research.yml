# Weekly SP500 research (Monday 16:00 Romania) and on demand from the dashboard's "Run research" button.
# Runs yahoo_unificat.py, commits the new Excel reports, then rebuilds and publishes the site.
name: Research SP500
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research
  cancel-in-progress: false
env:
  TZ: Europe/Bucharest
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the research (all S&P 500 stocks)
        run: python yahoo_unificat.py
      - name: Save the new reports in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/SP500_*.xlsx Output/SP500_*.json Output/complet Investitii
          git commit -m "Weekly research $(date +'%d.%m.%Y %H:%M')" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Build the site
        run: python build_site.py --refresh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
