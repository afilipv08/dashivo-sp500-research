# Daily SP500 research at 16:00 Romania time (every day, including weekends), plus catch-up runs the same day,
# and on demand from the dashboard's "Run research" button.
# Runs yahoo_unificat.py, commits the new Excel reports and the Top 10 history, then rebuilds and publishes the site.
# GitHub cron is in UTC and can start hours late or be dropped: several schedules per day feed a gate that runs
# whenever no research has been recorded since the most recent 16:00 Romania time (GitHub often starts
# scheduled jobs hours late, past midnight, so a same-day check skipped every run).
name: Research SP500
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: research
  cancel-in-progress: false
env:
  TZ: Europe/Bucharest
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Run once after each 16:00 Romania time, even when GitHub starts the job hours late
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timedelta
          now = datetime.now()                      # TZ=Europe/Bucharest for the whole job
          boundary = now.replace(hour=16, minute=0, second=0, microsecond=0)
          if now < boundary:
              boundary -= timedelta(days=1)         # the most recent 16:00 that has already passed
          days = json.load(open('Output/top10_history.json')).get('days') or []
          last = max((d.get('at') or '' for d in days), default='')
          due = not last or datetime.fromisoformat(last[:19]) < boundary
          print('run=' + ('true' if due else 'false'))
          print(f'last research {last or "none"}, due since {boundary:%Y-%m-%d %H:%M}', file=__import__('sys').stderr)
          EOF
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Run the research (all S&P 500 stocks)
        if: steps.gate.outputs.run == 'true'
        run: python yahoo_unificat.py
      - name: Save the new reports in the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output/SP500_*.xlsx Output/SP500_*.json Output/complet Output/top10_history.json Investitii
          git commit -m "Daily research $(date +'%d.%m.%Y %H:%M')" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Build the site
        if: steps.gate.outputs.run == 'true'
        run: python build_site.py --refresh
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      - name: Wait for the Pages artifact to become listable
        if: steps.gate.outputs.run == 'true'
        run: sleep 30
      - id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5
