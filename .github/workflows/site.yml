# Keeps the site fresh without the computer: live prices every 30 minutes while the US market is open,
# crypto every 2 hours otherwise, and a rebuild after every code change pushed to main.
name: Update site
on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
    - cron: '15 */2 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: true
env:
  TZ: Europe/Bucharest
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the site with fresh prices
        run: python build_site.py --refresh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
